<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Artikel | TJ Manufaktur Admin</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><header class="admin-top"><div class="admin-brand"><img src="../assets/Logo.png" alt="TJ Manufaktur"><div><small>ADMINBEREICH</small><strong>Artikelverwaltung</strong></div></div><nav class="admin-nav"><a href="./">Bestellungen</a><a class="active" href="products.html">Artikel</a></nav></header><main class="admin-shell"><section class="admin-intro"><div><span class="eyebrow">TJ MANUFAKTUR · SORTIMENT</span><h1>Artikel verwalten.</h1><p>Preise, Varianten, Personalisierung und Bestand zentral verwalten.</p></div><button class="admin-btn" id="newBtn">+ Neuer Artikel</button></section><section class="stats" id="productStats"></section><section class="toolbar"><label class="search"><span>Suche</span><input id="productSearch" type="search" placeholder="Name, SKU oder Kategorie"></label><label><span>Status</span><select id="activeFilter"><option value="">Alle</option><option value="1">Aktiv</option><option value="0">Archiviert</option></select></label></section><section class="orders-panel"><div class="panel-head"><div><span class="eyebrow">SORTIMENT</span><h2>Artikel</h2></div><span id="productCount"></span></div><div class="table-wrap"><table><thead><tr><th>Artikel</th><th>SKU</th><th>Preis</th><th>Bestand</th><th>Status</th><th></th></tr></thead><tbody id="productsBody"></tbody></table></div><div id="productEmpty" class="empty" hidden>Keine Artikel gefunden.</div></section></main><dialog id="productDialog"><button class="dialog-close" id="closeProduct" aria-label="Schließen">×</button><form id="productForm" class="product-form"><span class="eyebrow">ARTIKEL</span><h2 id="formTitle">Neuer Artikel</h2><input type="hidden" id="productId"><div class="form-grid"><label>Name<input id="pName" required maxlength="120"></label><label>SKU<input id="pSku" maxlength="60"></label><label>Kategorie<input id="pCategory" maxlength="100"></label><label>Preis (€)<input id="pPrice" type="number" min="0" step="0.01" required></label><label>Sortierung<input id="pSort" type="number" step="1" value="0"></label><label>Bestand<input id="pStock" type="number" min="0" step="1" value="0"></label></div><label class="check"><input id="pUnlimited" type="checkbox"> Auf Bestellung gefertigt / unbegrenzter Bestand</label><label class="check"><input id="pActive" type="checkbox" checked> Artikel aktiv</label><label class="check"><input id="pPersonalizable" type="checkbox" checked> Artikel kann personalisiert werden</label><label>Beschreibung<textarea id="pDescription" rows="4" maxlength="1000"></textarea></label><label>Varianten <small>(eine pro Zeile)</small><textarea id="pVariants" rows="4"></textarea></label><label>Tags <small>(eine pro Zeile)</small><textarea id="pTags" rows="3"></textarea></label><div class="form-grid"><label>Personalisierungsfeld<input id="pLabel" placeholder="z. B. Wunschtext"></label><label>Platzhalter<input id="pPlaceholder" placeholder="z. B. Lena & Tim"></label></div><div class="form-actions"><button type="button" class="row-btn danger" id="archiveBtn" hidden>Archivieren</button><button class="admin-btn" id="saveProduct" type="submit">Speichern</button></div><p class="sub" id="formMessage"></p></form></dialog><script src="products.js?v=20260924-2"></script></body></html>
