<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Checkout Vorschau | TJ Manufaktur</title><link rel="icon" href="assets/Logo.png"><link rel="stylesheet" href="style.css"><style>:root{--g:#b88735;--ink:#171717;--bg:#f5f1ea;--line:#ddd4c6;--muted:#6d675f}body{background:var(--bg);color:var(--ink)}.top{background:#171717;color:#fff;padding:14px 0}.top .wrap{display:flex;align-items:center;justify-content:space-between}.top img{width:58px}.badge{border:1px solid #735a2f;color:#ddb463;padding:8px;font-size:11px;letter-spacing:.12em}.checkout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:28px;padding:46px 0 70px}.card{background:#fff;border:1px solid var(--line);padding:26px}.card h1,.card h2{margin-top:0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.step{font-size:12px;padding:7px 9px;border:1px solid var(--line)}.step.on{background:#171717;color:#fff;border-color:#171717}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;background:#fff;font:inherit}.checks{display:grid;gap:12px;margin:20px 0;font-size:13px;line-height:1.45}.checks label{display:flex;align-items:flex-start;gap:9px}.checks input{margin-top:3px}.pay{width:100%;padding:15px;border:0;background:var(--g);font-weight:800;font-size:16px;cursor:pointer}.back{display:inline-block;margin-top:14px;color:#665b4b}.item{padding:13px 0;border-bottom:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:16px}.muted{color:var(--muted);font-size:13px}.totals{padding-top:18px;display:grid;gap:9px}.total{font-size:22px;font-weight:800}.notice{background:#eee7dc;border-left:3px solid var(--g);padding:13px;margin-bottom:20px;font-size:13px}.empty{text-align:center;padding:40px 0;color:var(--muted)}@media(max-width:800px){.checkout{grid-template-columns:1fr}.summary{order:-1}.grid2{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><div style="display:flex;align-items:center;gap:12px"><img src="assets/Logo.png" alt="TJ Manufaktur"><div><strong>TJ MANUFAKTUR</strong><br><span style="color:#aaa">Checkout · Testmodus</span></div></div><span class="badge">KEINE ZAHLUNG</span></div></header><main class="wrap checkout"><section class="card"><div class="steps"><span class="step">1 Warenkorb</span><span class="step on">2 Daten & Versand</span><span class="step">3 Zahlung</span></div><h1>Fast geschafft.</h1><div class="notice"><strong>Privater Test:</strong> Dieses Formular löst aktuell weder Bestellung noch Zahlung aus. Es dient zum Aufbau des späteren Checkout-Ablaufs.</div><form id="checkoutForm"><div class="grid2"><div class="field"><label for="first">Vorname *</label><input id="first" autocomplete="given-name" required></div><div class="field"><label for="last">Nachname *</label><input id="last" autocomplete="family-name" required></div></div><div class="field"><label for="email">E-Mail *</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="street">Straße & Hausnummer *</label><input id="street" autocomplete="street-address" required></div><div class="grid2"><div class="field"><label for="zip">PLZ *</label><input id="zip" inputmode="numeric" autocomplete="postal-code" required></div><div class="field"><label for="city">Ort *</label><input id="city" autocomplete="address-level2" required></div></div><div class="field"><label for="country">Land</label><select id="country"><option>Deutschland</option></select></div><div class="field"><label for="note">Hinweis zur Bestellung (optional)</label><textarea id="note" rows="3" maxlength="500" placeholder="z. B. Geschenk, Terminwunsch oder Rückfrage"></textarea></div><div class="checks"><label><input type="checkbox" required> <span>Ich habe die <a href="agb.html" target="_blank">AGB</a> gelesen und akzeptiere sie. *</span></label><label><input type="checkbox" required> <span>Ich habe die <a href="widerruf.html" target="_blank">Widerrufsbelehrung</a> und die Hinweise zu personalisierten Waren zur Kenntnis genommen. *</span></label><label><input type="checkbox" required> <span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> zur Kenntnis genommen. *</span></label></div><button class="pay" type="submit">Weiter zur Zahlung →</button><a class="back" href="shop-preview.html">← Zurück zum Warenkorb</a></form></section><aside class="card summary"><h2>Bestellübersicht</h2><div id="items"></div><div id="totals" class="totals"></div></aside></main><script>const CART_KEY='tj_shop_cart_v1';let cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]');const euro=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){if(!cart.length){items.innerHTML='<div class="empty">Der Warenkorb ist leer.</div>';totals.innerHTML='';document.querySelector('.pay').disabled=true;return}items.innerHTML=cart.map(i=>`<div class="item"><div class="row"><strong>${esc(i.name)}</strong><strong>${euro(i.price*i.qty)}</strong></div><div class="muted">${i.qty} × ${euro(i.price)} · ${esc(i.variant)}${i.personal?' · „'+esc(i.personal)+'“':''}</div></div>`).join('');const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0),shipping=subtotal>=50?0:4.9,total=subtotal+shipping;totals.innerHTML=`<div class="row"><span>Zwischensumme</span><span>${euro(subtotal)}</span></div><div class="row"><span>Versand</span><span>${shipping?euro(shipping):'kostenlos'}</span></div><div class="row total"><span>Gesamt</span><span>${euro(total)}</span></div><div class="muted">Kleinunternehmer gemäß § 19 UStG – kein Ausweis der Umsatzsteuer.</div>`}checkoutForm.onsubmit=e=>{e.preventDefault();if(!checkoutForm.reportValidity())return;const data={first:first.value,last:last.value,email:email.value,street:street.value,zip:zip.value,city:city.value,country:country.value,note:note.value};sessionStorage.setItem('tj_checkout_customer',JSON.stringify(data));alert('Checkout-Test erfolgreich. Als Nächstes verbinden wir diesen Schritt mit der gehosteten Zahlungsseite.');};render();</script></body></html>
